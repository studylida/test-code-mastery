[project]
name = "test-code-mastery-backend"
version = "0.1.0"
description = "FastAPI & pytest 손코딩 훈련을 위한 실습 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
